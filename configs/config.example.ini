# =====================================================================
# Streamer Jetson <-> PC — Configuration template
# =====================================================================
# Copy this file to config.ini and edit values for your environment.
# Resolution order at runtime:
#   1. environment variable (one-off override; name shown above each key)
#   2. configs/config.local.ini  (gitignored personal override)
#   3. configs/config.ini        (the active main file)
#   4. configs/config.example.ini (this file; committed defaults)
#   5. hardcoded fallback in config_loader.py
#
# Defaults below assume the documented direct-Ethernet setup:
#   Jetson   192.168.50.1   (eth0)
#   Laptop   192.168.50.2
# =====================================================================


[mqtt]
# env: MQTT_BROKER
# Local mosquitto running on the Jetson. For the public-broker fallback
# set broker = test.mosquitto.org (NOT recommended for sensitive data).
broker = 192.168.50.1

# env: MQTT_PORT
port = 1883

# env: MQTT_PREFIX
prefix = projectA/jetson-01

# env: MQTT_CLIENT_ID
client_id = jetson-01-master


[rtsp]
# env: RTSP_URL
# URL the Windows app connects to for live video.
# Must match what MediaMTX + GStreamer expose on the Jetson.
url = rtsp://192.168.50.1:8554/jetson


[inference]
# env: ENGINE_DIR
# Directory containing TensorRT engines. The engine filename pattern is
# hardcoded as best_fp16_{imgsz}.engine — matches existing behavior in
# master_agent.py / run_trt_video.py.
engine_dir = /path/to/your/models_y8s_trt

# env: INPUT_VIDEO
# Default input video for non-camera runs.
input_video = /path/to/your/input.mp4

# env: IMGSZ
imgsz = 640

# env: CONF
conf = 0.25

# env: SCRIPT_PATH
# Optional explicit path to run_trt_video.py.
# If left blank, master_agent.py looks for it next to itself in jetson/.
script_path =
